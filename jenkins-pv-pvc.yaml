apiVersion: v1
kind: PersistentVolume
metadata:
  name: jenkins-pv
  namespace: jenkins
spec:
  accessModes:
   - ReadWriteOnce
  capacity:
    storage: 5Gi
  hostPath:
    path: /data/jenkins-volume/

---
    
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
 name: jenkins-pvc
 namespace: jenkins
spec:
 accessModes:
 - ReadWriteOnce
 resources: 
  requests:
    storage: 5Gi
   
